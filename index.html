<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitBite — קלוריות ומאקרו לכל מתכון</title>
<meta name="description" content="הדביקו מתכון וקבלו קלוריות, חלבון, פחמימות ושומן למנה, לכף ול-100 גרם.">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F2EA;--surface:#FFFFFF;--sunk:#EFE9DD;--ink:#16231D;--mute:#5F6F67;--line:#E2DACB;--brand:#12432F;--on-brand:#FFFFFF;--accent:#C8532F;--p:#12432F;--c:#C8532F;--f:#C99A2E;--r:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101412;--surface:#171D1A;--sunk:#0D110F;--ink:#EEF2EE;--mute:#98A79F;--line:#26302B;--brand:#8FC4A5;--on-brand:#0D110F;--accent:#E08A67;--p:#8FC4A5;--c:#E08A67;--f:#D9B25A}}
:root[data-theme=dark]{--bg:#101412;--surface:#171D1A;--sunk:#0D110F;--ink:#EEF2EE;--mute:#98A79F;--line:#26302B;--brand:#8FC4A5;--on-brand:#0D110F;--accent:#E08A67;--p:#8FC4A5;--c:#E08A67;--f:#D9B25A}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:400 16px/1.5 Rubik,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.logo svg{width:18px;height:18px;stroke:var(--on-brand)}
.tools{display:flex;gap:8px}
.ico{min-width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;padding:0 12px;gap:6px;grid-auto-flow:column;font-size:14px;transition:transform .15s,border-color .15s}
.ico:hover{border-color:var(--brand);transform:translateY(-2px)}.ico:active{transform:scale(.96)}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:clamp(28px,4.4vw,44px);line-height:1.12;letter-spacing:-.03em;font-weight:800;max-width:16ch;margin:16px 0 8px}
.lead{color:var(--mute);max-width:46ch;margin-bottom:28px}
.grid{display:grid;gap:20px;grid-template-columns:1fr;padding-bottom:64px}
@media(min-width:960px){.grid{grid-template-columns:5fr 7fr;align-items:start}.side{position:sticky;top:16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;position:relative}
.card+.card{margin-top:20px}
.lab{font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.chip{font-size:13px;padding:8px 12px;min-height:36px;border-radius:999px;background:var(--sunk);transition:background .15s}
.chip:hover{background:var(--line)}
textarea{width:100%;min-height:170px;resize:vertical;background:var(--sunk);border:1px solid transparent;border-radius:var(--r);padding:14px;line-height:1.7}
textarea:focus,input.txt:focus{border-color:var(--brand);outline:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--sunk);font-size:20px;transition:transform .15s}
.step button:hover{transform:translateY(-2px)}.step button:active{transform:scale(.94)}
.step b{min-width:34px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.btn{width:100%;min-height:52px;border-radius:var(--r);background:var(--brand);color:var(--on-brand);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;transform:none;cursor:wait}
.btn.sec{background:var(--sunk);color:var(--ink);width:auto;padding:0 18px;min-height:44px}
.spin{width:18px;height:18px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.hist{display:grid;gap:8px;max-height:260px;overflow:auto}
.h{display:flex;align-items:center;gap:8px;border-radius:12px;background:var(--sunk);padding:4px 4px 4px 12px;transition:transform .15s}
.h:hover{transform:translateY(-2px)}.h.on{outline:2px solid var(--brand)}
.h .go{flex:1;text-align:start;padding:8px 0;min-width:0}
.h .go b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h .go span{font-size:12px;color:var(--mute)}
.h .del{width:44px;height:44px;color:var(--mute);border-radius:10px}.h .del:hover{color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:14px;margin-bottom:20px}
.tabs button{min-height:44px;border-radius:10px;font-size:13px;font-weight:500;color:var(--mute);transition:background .15s}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:clamp(64px,12vw,96px);line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big span{font-size:18px;color:var(--mute)}
.sub{color:var(--mute);font-size:14px;margin:4px 0 20px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:14px}
.bar i{display:block;transition:flex .4s}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mac div{background:var(--sunk);border-radius:12px;padding:12px}
.mac small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.mac small:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k)}
.mac b{font-size:22px;font-variant-numeric:tabular-nums}
.ctl{display:grid;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.ctl .row{margin:0}.ctl label{font-size:14px;color:var(--mute)}
input.num{width:84px;height:44px;border-radius:12px;background:var(--sunk);border:1px solid transparent;text-align:center;font-weight:600}
input.num:focus{border-color:var(--brand);outline:0}
h2{font-size:17px;margin-bottom:12px}
.ing{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ing:first-of-type{border-top:0}
.ing b{font-weight:600}.ing em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.ing small{color:var(--mute);font-size:13px;grid-column:1/-1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags span{font-size:13px;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:500}
.tip{background:var(--sunk);border-radius:14px;padding:16px;font-size:15px;border-inline-start:3px solid var(--accent)}
.empty{text-align:center;padding:56px 20px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.set{margin-bottom:20px}
.set p{font-size:13px;color:var(--mute);margin:6px 0 12px}
input.txt{width:100%;height:46px;border-radius:12px;background:var(--sunk);border:1px solid transparent;padding:0 14px;direction:ltr}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:14px;font-weight:500;z-index:9;animation:t .25s ease-out}
@keyframes t{from{transform:translateY(12px);opacity:0}}
[hidden]{display:none!important}
@media(max-width:600px){.mac b{font-size:18px}.card{padding:18px}.tabs button{font-size:12px;padding:0 2px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg></i>FitBite</div>
  <div class="tools">
    <button class="ico" id="theme" aria-label="החלפת מצב תצוגה"></button>
    <button class="ico" id="gear" aria-label="הגדרות מפתח AI" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-3 3 3 3m-6-1 2 2"/></svg><span>מפתח AI</span></button>
  </div>
</header>

<section class="card set" id="settings" hidden>
  <div class="lab">מפתח Gemini API</div>
  <p>המפתח נשמר בדפדפן שלכם בלבד ונשלח רק ל-Google. אל תשתפו קובץ שמכיל אותו.</p>
  <div class="row" style="margin:0"><input class="txt" id="key" type="password" autocomplete="off" aria-label="מפתח API" placeholder="AIza…"><button class="btn sec" id="saveKey">שמירה</button></div>
</section>

<h1>כמה קלוריות יש במתכון שלך?</h1>
<p class="lead">הדביקו רשימת מצרכים וקבלו קלוריות וערכי מאקרו למנה, לכף ול-100 גרם.</p>

<main class="grid">
  <div class="side">
    <form class="card" id="form">
      <div class="lab"><label for="txt">מצרכי המתכון</label>
        <span style="display:flex;gap:6px"><button type="button" class="chip" id="demo">מתכון לדוגמה</button><button type="button" class="chip" id="clear" aria-label="ניקוי הטופס">נקי</button></span></div>
      <textarea id="txt" placeholder="חצי כוס שיבולת שועל (40 גרם)&#10;גביע קוטג' 5%&#10;2 ביצים לארג'&#10;חצי כפית דבש"></textarea>
      <div class="row"><div><b style="font-weight:600">כמה מנות?</b><div class="sub" style="margin:0">הכמות מתחלקת שווה בשווה</div></div>
        <div class="step"><button type="button" id="plus" aria-label="הוספת מנה">+</button><b id="sv">2</b><button type="button" id="minus" aria-label="הפחתת מנה">−</button></div></div>
      <button class="btn" id="go" type="submit"><span id="goT">חשב ערכים תזונתיים</span></button>
      <div class="err" id="err" role="alert" hidden></div>
    </form>
    <section class="card"><div class="lab">ארכיון מתכונים</div><div class="hist" id="hist"></div></section>
  </div>
  <div id="out" aria-live="polite"></div>
</main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={servings:2,tab:'serving',custom:100,cooked:320,spoon:15,res:null,busy:false,
  hist:(()=>{let h;try{h=JSON.parse(store.get('fitbite_history','null'))}catch(e){}
    const lim=Date.now()-14*864e5;
    if(Array.isArray(h))return h.filter(i=>i.id==='demo-1'||(i.lastTouched||Date.now())>lim);
    return[{id:'demo-1',recipeName:'פנקייק חלבון שיבולת שועל',recipeText:'כוס שיבולת שועל\nסקופ אבקת חלבון וניל\nחצי כוס חלב שקדים\nביצה אחת',servings:2,totalCalories:480,totalWeightGrams:320,gramsPerTablespoon:15,totalProtein:32,totalCarbs:58,totalFats:12,
    ingredients:[{cleanName:'שיבולת שועל דקה',originalText:'כוס שיבולת שועל',weightGrams:80,calories:300,protein:10,carbs:53,fats:5},{cleanName:'אבקת חלבון',originalText:'סקופ אבקת חלבון וניל',weightGrams:30,calories:120,protein:24,carbs:2,fats:1.5},{cleanName:'חלב שקדים',originalText:'חצי כוס חלב שקדים',weightGrams:120,calories:30,protein:1,carbs:1,fats:2.5},{cleanName:"ביצה לארג'",originalText:'ביצה אחת',weightGrams:50,calories:70,protein:6,carbs:0,fats:5}],
    dietaryNotes:['עשיר בחלבון','מתאים לחיטוב','דל סוכר'],recommendationTip:"להגברת הסיבים והשובע, הוסיפו כף זרעי צ'יה או חצי בננה. הליכה קלה של 10–15 דקות אחרי הארוחה עוזרת לוויסות הסוכר בדם.",lastTouched:Date.now()}]})()};
const ic={sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>',moon:'<svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>',del:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>'};

function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function theme(){const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;$('theme').innerHTML=dark?ic.sun:ic.moon;return dark}
const saved=store.get('fitbite_theme','');if(saved)document.documentElement.dataset.theme=saved;theme();
$('theme').onclick=()=>{const n=theme()?'light':'dark';document.documentElement.dataset.theme=n;store.set('fitbite_theme',n);theme()};
$('gear').onclick=()=>{const s=$('settings');s.hidden=!s.hidden;$('gear').setAttribute('aria-expanded',!s.hidden);if(!s.hidden)$('key').focus()};
$('key').value=store.get('fitbite_api_key','');
$('saveKey').onclick=()=>{store.set('fitbite_api_key',$('key').value.trim());$('settings').hidden=true;$('gear').setAttribute('aria-expanded','false');toast('המפתח נשמר')};

const sv=()=>{$('sv').textContent=S.servings};
$('plus').onclick=()=>{S.servings++;sv();if(S.res)render()};
$('minus').onclick=()=>{S.servings=Math.max(1,S.servings-1);sv();if(S.res)render()};
$('demo').onclick=()=>{$('txt').value="גביע קוטג' 5% (250 גרם)\n2 ביצים\n3 כפות קמח שיבולת שועל (כ-30 גרם)\nקורט מלח ופלפל";S.servings=2;sv();toast('מתכון לדוגמה נטען')};
$('clear').onclick=()=>{$('txt').value='';toast('הטופס נוקה')};

function saveHist(){store.set('fitbite_history',JSON.stringify(S.hist))}
function renderHist(){
  $('hist').innerHTML=S.hist.length?S.hist.map(i=>`<div class="h${S.res&&S.res.id===i.id?' on':''}"><button class="go" data-id="${esc(i.id)}"><b>${esc(i.recipeName)}</b><span>${esc(i.totalCalories)} קל׳ · ${esc(i.totalProtein||0)}ג׳ חלבון</span></button><button class="del" data-del="${esc(i.id)}" aria-label="מחיקת ${esc(i.recipeName)}">${ic.del}</button></div>`).join(''):'<p class="sub" style="margin:0">מתכונים שתנתחו יישמרו כאן.</p>'}
$('hist').onclick=e=>{
  const d=e.target.closest('[data-del]');
  if(d){S.hist=S.hist.filter(i=>i.id!==d.dataset.del);if(S.res&&S.res.id===d.dataset.del)S.res=null;saveHist();renderHist();render();toast('המתכון הוסר');return}
  const g=e.target.closest('[data-id]');if(!g)return;
  const it=S.hist.find(i=>i.id===g.dataset.id);if(!it)return;
  it.lastTouched=Date.now();S.hist=[it,...S.hist.filter(i=>i!==it)];saveHist();
  S.res=it;$('txt').value=it.recipeText||'';S.servings=it.servings||4;sv();S.tab='serving';S.cooked=it.totalWeightGrams||320;S.spoon=it.gramsPerTablespoon||15;
  renderHist();render();$('out').scrollIntoView({behavior:'smooth',block:'start'})};

function metrics(){
  const r=S.res,w=S.cooked>0?S.cooked:1,sp=S.servings||1;
  const per=(t,f)=>Math.round(t*f);
  const v=k=>r[k]||0,T={c:r.totalCalories,p:v('totalProtein'),k:v('totalCarbs'),f:v('totalFats')};
  const mk=f=>({c:per(T.c,f),p:per(T.p,f),k:per(T.k,f),f:per(T.f,f)});
  switch(S.tab){
    case'serving':return{...mk(1/sp),l:'קלוריות למנה',s:`סך הכול חלקי ${sp} מנות שוות`};
    case'spoon':return{...mk(S.spoon/w),l:'קלוריות לכף הגשה',s:`כף ששוקלת ${S.spoon} גרם`};
    case'100g':return{...mk(100/w),l:'קלוריות ל-100 גרם',s:`לפי משקל מבושל של ${S.cooked} גרם`};
    default:return{...mk(S.custom/w),l:`קלוריות ל-${S.custom} גרם`,s:'לפי המשקל שהזנתם'}}}

function render(){
  renderHist();
  const o=$('out'),r=S.res;
  if(!r){o.innerHTML='<div class="card empty"><b>עוד אין תוצאה</b>הדביקו מתכון ולחצו על חישוב, או פתחו מתכון מהארכיון.</div>';return}
  const m=metrics(),tot=(m.p*4+m.k*4+m.f*9)||1;
  const ctl=S.tab==='serving'?'':S.tab==='spoon'?`<div class="row"><label for="n1">משקל כף (גרם)</label><input class="num" id="n1" type="number" min="1" value="${S.spoon}" data-set="spoon"></div>`:S.tab==='100g'?'':`<div class="row"><label for="n2">כמות (גרם)</label><input class="num" id="n2" type="number" min="1" value="${S.custom}" data-set="custom"></div>`;
  const tabs=[['serving','למנה'],['tablespoon','לכף'],['100g','ל-100 גרם'],['custom','כמות אישית']];
  o.innerHTML=`<section class="card">
  <div class="lab" style="margin-bottom:14px"><span>${esc(r.recipeName)}</span><button class="chip" id="copy">העתקת סיכום</button></div>
  <div class="tabs" role="tablist">${tabs.map(([k,t])=>{const key=k==='tablespoon'?'spoon':k;return`<button role="tab" data-tab="${key}" aria-selected="${S.tab===key}">${t}</button>`}).join('')}</div>
  <div class="big"><b>${m.c}</b><span>${esc(m.l)}</span></div><p class="sub">${esc(m.s)}</p>
  <div class="bar" aria-hidden="true"><i style="flex:${m.p*4/tot};background:var(--p)"></i><i style="flex:${m.k*4/tot};background:var(--c)"></i><i style="flex:${m.f*9/tot};background:var(--f)"></i></div>
  <div class="mac"><div style="--k:var(--p)"><small>חלבון</small><b>${m.p}ג׳</b></div><div style="--k:var(--c)"><small>פחמימות</small><b>${m.k}ג׳</b></div><div style="--k:var(--f)"><small>שומן</small><b>${m.f}ג׳</b></div></div>
  <div class="ctl">${ctl}<div class="row"><label for="n3">משקל מבושל סופי (גרם)</label><div class="step"><button data-w="-10" aria-label="הפחתת 10 גרם">−</button><input class="num" id="n3" type="number" min="1" value="${S.cooked}" data-set="cooked"><button data-w="10" aria-label="הוספת 10 גרם">+</button></div></div></div></section>
  <section class="card"><h2>רכיבים</h2>${(r.ingredients||[]).map(i=>`<div class="ing"><b>${esc(i.cleanName)} · ${esc(i.weightGrams)}ג׳</b><em>${esc(i.calories)} קל׳</em><small>${esc(i.originalText)} — ח׳ ${esc(i.protein)} · פ׳ ${esc(i.carbs)} · ש׳ ${esc(i.fats)}</small></div>`).join('')}</section>
  ${(r.dietaryNotes?.length||r.recommendationTip)?`<section class="card">${r.dietaryNotes?.length?`<div class="tags">${r.dietaryNotes.map(n=>`<span>${esc(n)}</span>`).join('')}</div>`:''}${r.recommendationTip?`<div class="tip">${esc(r.recommendationTip)}</div>`:''}</section>`:''}`}

$('out').addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;render();return}
  const w=e.target.closest('[data-w]');if(w){S.cooked=Math.max(1,S.cooked+ +w.dataset.w);render();return}
  if(e.target.id==='copy'){const r=S.res,x=S.tab,old=S.tab,sv=S.servings;const f=t=>{S.tab=t;return metrics()};const a=f('serving'),b=f('100g'),c=f('spoon');S.tab=old;
    const txt=`סיכום תזונתי · FitBite\n${r.recipeName}\n—\nסה״כ: ${r.totalCalories} קל׳ | חלבון ${r.totalProtein||0}ג׳ | פחמימות ${r.totalCarbs||0}ג׳ | שומן ${r.totalFats||0}ג׳\nמשקל מבושל: ${S.cooked} גרם\nל-100 גרם: ${b.c} קל׳ (ח׳ ${b.p} | פ׳ ${b.k} | ש׳ ${b.f})\nלמנה (${sv} מנות): ${a.c} קל׳ (ח׳ ${a.p} | פ׳ ${a.k} | ש׳ ${a.f})\nלכף (~${S.spoon} גרם): ${c.c} קל׳ (ח׳ ${c.p} | פ׳ ${c.k} | ש׳ ${c.f})`;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('הסיכום הועתק'),()=>toast('ההעתקה נכשלה'))}});
$('out').addEventListener('change',e=>{const k=e.target.dataset.set;if(!k)return;const v=Math.max(1,parseFloat(e.target.value)||1);S[k]=v;render()});

function fail(m){const e=$('err');e.textContent=m;e.hidden=!m}
$('form').onsubmit=async ev=>{
  ev.preventDefault();if(S.busy)return;
  const text=$('txt').value.trim();
  if(!text)return fail('הדביקו קודם את מצרכי המתכון.');
  const key=store.get('fitbite_api_key','');
  if(!key){fail('חסר מפתח Gemini API. הוסיפו אותו תחת "מפתח AI".');$('settings').hidden=false;return}
  fail('');S.busy=true;$('go').disabled=true;$('go').innerHTML='<span class="spin"></span><span>מנתח את המתכון…</span>';
  const sys=`You are a professional sports dietitian. Convert each ingredient to grams and estimate calories, protein, carbs, fats. Respond ONLY with valid JSON: {"recipeName":"Hebrew name","totalCalories":int,"totalWeightGrams":int,"gramsPerTablespoon":int,"totalProtein":int,"totalCarbs":int,"totalFats":int,"ingredients":[{"originalText":"","cleanName":"Hebrew","weightGrams":int,"calories":int,"protein":int,"carbs":int,"fats":int}],"dietaryNotes":["up to 3 Hebrew tags"],"recommendationTip":"2-3 warm Hebrew sentences with practical advice for this recipe"}`;
  try{
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:`Recipe:\n${text}\nServings: ${S.servings}`}]}],systemInstruction:{parts:[{text:sys}]},generationConfig:{responseMimeType:'application/json'}})});
    if(!res.ok)throw new Error(res.status===400||res.status===403?'המפתח לא תקין או שאין לו הרשאה.':'שגיאה בתקשורת עם שרת ה-AI.');
    const d=await res.json(),raw=d?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!raw)throw new Error('לא התקבלה תשובה תקינה מהניתוח.');
    const r=JSON.parse(raw);
    if(!(r.totalCalories>0))throw new Error('הניתוח לא החזיר ערכים תקינים. נסו לפרט יותר את המצרכים.');
    Object.assign(r,{id:String(Date.now()),recipeText:text,servings:S.servings,lastTouched:Date.now()});
    S.res=r;S.cooked=r.totalWeightGrams||320;S.spoon=r.gramsPerTablespoon||15;S.tab='serving';
    S.hist=[r,...S.hist.filter(i=>i.id!=='demo-1')];saveHist();render();toast('המתכון נותח');
    if(innerWidth<960)$('out').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){fail(e instanceof SyntaxError?'התשובה מה-AI לא הייתה תקינה. נסו שוב.':e.message||'אירעה שגיאה בניתוח.')}
  finally{S.busy=false;$('go').disabled=false;$('go').innerHTML='<span>חשב ערכים תזונתיים</span>'}};

S.res=S.hist[0]||null;if(S.res){S.cooked=S.res.totalWeightGrams||320;S.spoon=S.res.gramsPerTablespoon||15;S.servings=S.res.servings||2;sv()}
render();
</script>
</body>
</html>
